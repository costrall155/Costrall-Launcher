name: Costrall Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: costrall-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-test-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend integration test
        run: node scripts/test-backend.js

      - name: Electron application smoke test
        shell: pwsh
        run: |
          $env:COSTRALL_SMOKE = '1'
          $env:COSTRALL_DEBUG = '1'
          $electron = Resolve-Path '.\node_modules\electron\dist\electron.exe'
          $proc = Start-Process -FilePath $electron -ArgumentList '.' -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Electron smoke test failed with exit code $($proc.ExitCode)" }

      - name: Build Windows installer
        run: npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CostrallLauncher-Windows-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
