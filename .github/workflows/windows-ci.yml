name: Costrall Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: costrall-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-test-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend integration test
        run: node scripts/test-backend.js

      - name: Electron application startup smoke test
        shell: pwsh
        run: |
          $electron = Resolve-Path '.\\node_modules\\electron\\dist\\electron.exe'
          $proc = Start-Process -FilePath $electron -ArgumentList '.' -PassThru
          Start-Sleep -Seconds 15
          $proc.Refresh()
          if ($proc.HasExited) {
            throw "Electron exited during startup (exit code $($proc.ExitCode))"
          }
          Stop-Process -Id $proc.Id -Force
          Write-Host 'Electron remained running for 15 seconds; startup smoke test passed.'

      - name: Build Windows installer
        run: npm run dist

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: CostrallLauncher-Windows-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
